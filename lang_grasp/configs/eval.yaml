# Main evaluation config: success rate on the Seen and Unseen test splits and their harmonic mean H.
#   python src/eval.py ckpt_path=<CKPT> [KEY=VALUE ...]

defaults:
  - _self_
  - paths: local
  - hydra: default

name: eval
ckpt_path: ???   # checkpoint to evaluate (its text model is read from it)
splits: [test_seen, test_unseen]   # H uses these two; add test_unseen_all on the LGD re-split (scripts/resplit_lgd.py)
gate: null       # null | oracle (ground-truth mask of the prompted object) | detector (needs boxes)
boxes: null      # folder with boxes_<split>.npz of scripts/detect_boxes.py, for gate=detector

data:
  dir: ${paths.data_dir}
  batch_size: 32
  num_workers: 2
