# @package _global_
# Proposed: the grconvnet_clip baseline plus the region-text contrastive grounding loss (src/models/region_text_contrast.py)
# during training only. Same network at inference, same training settings as the baseline.
name: grconvnet_clip_contrast

data:
  text_model: clip-vit-base-patch32
  regions: true                # masks of the scene's objects, for the contrastive loss

model:
  fusion: albef
  contrast_weight: 0.01        # lambda, chosen among 0.01, 0.03, 0.1 on the Seen test (0.1 collapses in one seed)
  contrast_temperature: 0.07   # tau, CLIP's initial value
