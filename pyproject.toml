# Lint settings shared by every task folder; each task keeps its dependencies (requirements.txt) and test settings
# (its own pyproject.toml) in its folder.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "paper"]   # notebooks hold shell commands only

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]   # every task folder names its package src
