# Tool settings only; the dependencies are in requirements.txt.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "paper"]   # notebooks hold shell commands only

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
