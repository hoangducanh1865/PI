# IRASim's configs/evaluation/bridge/frame_ada.yaml (commit c72b6da), changed only where marked: the official
# checkpoint, generation on our subset of the Bridge test episodes, small batches for one T4.
dataset: "bridge"
sequence_interval: 1
val_start_frame_interval: 16
cam_ids: [0]
accumulate_action: False
pre_encode : True
normalize: True
mode: 'test'
annotation_name: 'annotation_subset'   # changed: scripts/setup_irasim.sh links the chosen test episodes here

anno: 'test_bridge_frame_ada'
debug: True
do_evaluate: True
final_frame_ada: False

evaluate_checkpoint: 'bridge/checkpoints/frame_ada/0300000.pt'

model: IRASim-XL/2
num_frames: 16
video_size: [256,320]
learn_sigma: False
extras: 3
mask_frame_num: 1

learning_rate: 1e-4
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 0
local_batch_size: 1
local_val_batch_size: 4   # changed from 32: one T4
max_train_steps: 300000
global_seed: 3407
num_workers: 2   # changed from 11: Kaggle has 4 CPUs
log_every: 100
val_every: 10000
gradient_accumulation_steps: 1
attention_mode: 'math'

resume_from_checkpoint : False
